# Linux packages (.deb and .rpm), built by scripts/package.sh with nfpm.
# Environment: VERSION, NFPM_ARCH (amd64 | arm64), COATI_BIN (compiled binary).
name: coati
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: web
priority: optional
maintainer: Coati <noreply@getcoati.com>
description: |
  Coati, the local program behind the browser extension.
  Talks to the AI model you run yourself; nothing goes through a server.
homepage: https://github.com/CARL-Bouvet/coati
license: AGPL-3.0

contents:
  - src: ${COATI_BIN}
    dst: /usr/bin/coati-broker
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/doc/coati/LICENSE

# The browser manifests and the user service unit are written by the
# binary itself (`--install --system`), not shipped as package files.
scripts:
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
