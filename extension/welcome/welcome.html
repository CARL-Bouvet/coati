<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coati</title>
  <link rel="stylesheet" href="../lib/theme.css" />
  <link rel="stylesheet" href="../lib/components.css" />
  <link rel="stylesheet" href="welcome.css" />
</head>
<body>
  <div class="welcome">
    <div id="langSelectorMount" class="welcome-lang"></div>

    <header class="welcome-hero">
      <div class="welcome-logo-zone">
        <img class="welcome-logo" src="../icons/coati.svg" alt="" width="900" height="780" />
      </div>
      <div class="welcome-intro">
        <h1 id="welcomeTitle" class="welcome-title"></h1>
        <p id="welcomeLead" class="welcome-lead"></p>
        <p id="welcomeLeadPrivacy" class="welcome-lead"></p>
        <p id="welcomeLeadServer" class="welcome-lead"></p>
        <p class="welcome-source">
          <a id="welcomeSource" class="c-text-link" href="https://github.com/CARL-Bouvet/coati" target="_blank" rel="noopener"></a>
          <span aria-hidden="true">·</span>
          <span id="welcomeLicence"></span>
        </p>
      </div>
    </header>

    <main class="welcome-content">
      <div id="welcomeSteps" class="welcome-steps"></div>
    </main>
  </div>

  <script src="welcome.js" type="module"></script>
</body>
</html>
