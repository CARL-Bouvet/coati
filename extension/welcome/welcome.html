<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coati</title>
  <link rel="stylesheet" href="../lib/theme.css" />
  <link rel="stylesheet" href="welcome.css" />
</head>
<body>
  <header class="welcome-header">
    <span class="welcome-logo-tile"><img class="welcome-logo" src="../icons/icon128.png" alt="" width="56" height="56" /></span>
    <span class="welcome-wordmark">Coati</span>
    <span id="langSelectorMount" class="welcome-lang-mount"></span>
  </header>

  <main class="welcome-main">
    <h1 id="welcomeTitle" class="welcome-title"></h1>
    <p id="welcomeLead" class="welcome-lead"></p>

    <section class="welcome-pin" aria-labelledby="pinTitle">
      <h2 id="pinTitle" class="welcome-section-title"></h2>
      <p id="pinBrowser" class="welcome-browser"></p>
      <ol id="pinSteps" class="welcome-pin-steps"></ol>
    </section>

    <section aria-labelledby="stepsTitle">
      <h2 id="stepsTitle" class="welcome-section-title"></h2>
      <ol class="welcome-steps">
        <li class="welcome-step">
          <span class="welcome-step-number" aria-hidden="true">1</span>
          <div class="welcome-step-body">
            <h3 id="stepProgramTitle" class="welcome-step-title"></h3>
            <p id="stepProgramText"></p>
            <a id="stepProgramLink" class="welcome-action welcome-action--primary" target="_blank" rel="noopener noreferrer"></a>
          </div>
        </li>
        <li class="welcome-step">
          <span class="welcome-step-number" aria-hidden="true">2</span>
          <div class="welcome-step-body">
            <h3 id="stepModelTitle" class="welcome-step-title"></h3>
            <p id="stepModelText"></p>
            <button id="stepModelAction" class="welcome-action" type="button"></button>
          </div>
        </li>
        <li class="welcome-step">
          <span class="welcome-step-number" aria-hidden="true">3</span>
          <div class="welcome-step-body">
            <h3 id="stepPageTitle" class="welcome-step-title"></h3>
            <p id="stepPageText"></p>
          </div>
        </li>
      </ol>
    </section>

    <p id="welcomeGesture" class="welcome-gesture"></p>
  </main>

  <script src="welcome.js" type="module"></script>
</body>
</html>
