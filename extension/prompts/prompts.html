<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Mes prompts — Coati</title>
  <link rel="stylesheet" href="../lib/theme.css" />
  <link rel="stylesheet" href="prompts.css" />
</head>
<body>
  <div id="connectionBanner" class="connection-banner" hidden>
    <span id="connectionBannerText"></span>
  </div>

  <header class="prompts-header">
    <h1>Mes prompts</h1>
    <p class="help">
      Une case range les prompts d'un site : les suggestions de Coati et les
      vôtres, mêlés, dans l'ordre que vous choisissez.
    </p>
  </header>

  <section id="allSitesNotice" class="all-sites-notice" hidden>
    <p id="allSitesText" class="all-sites-text"></p>
    <button id="allSitesRevoke" class="all-sites-revoke" type="button"></button>
  </section>

  <main id="board" class="board"></main>

  <script src="prompts.js" type="module"></script>
</body>
</html>
