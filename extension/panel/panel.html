<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coati</title>
  <link rel="stylesheet" href="../lib/theme.css" />
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="card.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Coati</span>
      <span id="status" class="status status--unknown">
        <span class="status-dot"></span>
        <span class="status-label">…</span>
      </span>
    </div>
    <span class="header-tools">
      <span id="langSelectorMount"></span>
      <span class="help-popover-wrap">
        <button
          id="helpButton"
          class="icon-button"
          type="button"
          aria-describedby="helpPopover"
          data-i18n-title="panelHelpButtonLabel"
          data-i18n-aria-label="panelHelpButtonLabel"
        >?</button>
        <div id="helpPopover" class="help-popover" role="tooltip">
          <p class="help-popover-text" data-i18n="panelHelpPopoverText"></p>
        </div>
      </span>
      <button id="openOptions" class="icon-button" type="button" data-i18n-title="panel_settings_title">⚙︎</button>
    </span>
  </header>

  <div id="connectionBanner" class="connection-banner" hidden>
    <span id="connectionBannerText" class="connection-banner-text"></span>
    <span class="connection-banner-actions">
      <button id="installDocLink" class="connection-banner-cta" type="button" hidden data-i18n="panel_install_doc_link">Comment l'installer</button>
      <button id="connectionBannerRetry" class="connection-banner-cta" type="button" hidden data-i18n="panel_retry_now">Réessayer</button>
      <button id="connectCoati" class="connection-banner-cta" type="button" hidden data-i18n="panel_open_settings">Ouvrir les réglages</button>
    </span>
  </div>

  <section id="siteCard" class="site-card" data-state="unreadable" aria-live="polite">
    <div class="site-card-head">
      <span class="site-card-icons">
        <span id="siteCardSpinner" class="site-card-spinner" hidden aria-hidden="true"></span>
        <img id="siteCardFavicon" class="site-card-favicon" alt="" hidden />
      </span>
      <button id="readPage" class="encart-read" type="button" hidden>
        <span class="encart-read-ring" aria-hidden="true"><img id="readPageIcon" class="encart-read-icon" alt="" /></span>
        <span id="readPageLabel" class="encart-read-label"></span>
      </button>
      <span id="siteCardLabel" class="site-card-label"></span>
      <button id="attachPage" class="switch" type="button" role="switch" aria-checked="false" disabled>
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="switch-text" data-i18n="panel_read_the_page">Lire la page</span>
      </button>
    </div>
    <p id="readPageNote" class="encart-read-note" hidden></p>
    <div class="site-card-actions">
      <div id="siteCardSuggestions" class="site-card-suggestions"></div>
      <button id="openMyPrompts" class="site-card-my-prompts" type="button" data-i18n="panel_my_prompts">Mes prompts ↗</button>
    </div>
  </section>

  <section id="firstRun" class="first-run" aria-labelledby="firstRunTitle" hidden>
    <div class="first-run-head">
      <img class="first-run-logo" src="../icons/icon48.png" alt="" width="28" height="28" />
      <h2 id="firstRunTitle" class="first-run-title"></h2>
    </div>
    <p id="firstRunNeverConnected" class="first-run-never-connected" data-i18n="neverConnectedTitle" hidden></p>
    <ol id="firstRunSteps" class="first-run-steps"></ol>
    <p id="firstRunLang" class="first-run-lang"></p>
  </section>

  <section id="neverConnected" class="never-connected" aria-labelledby="neverConnectedTitle" hidden>
    <span class="help-badge" aria-hidden="true"></span>
    <div class="never-connected-body">
      <h2 id="neverConnectedTitle" class="never-connected-title" data-i18n="neverConnectedTitle"></h2>
      <p class="never-connected-text" data-i18n="neverConnectedBody"></p>
      <button id="neverConnectedAction" class="toolbar-button toolbar-button--primary" type="button" data-i18n="neverConnectedAction"></button>
    </div>
  </section>

  <main id="messages" class="messages" aria-live="polite"></main>

  <footer class="composer">
    <div class="composer-bar">
      <span id="promptSavedNotice" class="prompt-saved-notice" aria-live="polite"></span>
      <button id="savePrompt" class="icon-button" type="button" data-i18n-title="panel_save_prompt" data-i18n-aria-label="panel_save_prompt" disabled>💾</button>
    </div>
    <textarea id="input" class="composer-input" data-i18n-placeholder="panel_input_placeholder" placeholder="Écrivez à Coati…" rows="1"></textarea>
    <div class="composer-actions">
      <button id="eraseConversation" class="link-button link-button--danger" type="button" data-i18n="panel_erase_conversation">Effacer la conversation</button>
      <button id="cancel" class="composer-button composer-button--ghost" type="button" hidden data-i18n="panel_cancel">Annuler</button>
      <button id="send" class="composer-button" type="button" data-i18n="panel_send">Envoyer</button>
    </div>
  </footer>

  <div id="buildInfo" class="build-info"></div>

  <script src="panel.js" type="module"></script>
</body>
</html>
