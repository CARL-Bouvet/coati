<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Coati — identity board</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #111318;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .board {
      padding: 32px;
    }
    .board__header {
      margin-bottom: 24px;
    }
    .board__name {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .board__hexes {
      font-size: 13px;
      color: #4a4e58;
      margin: 0 0 20px;
    }
    .board__specimen {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .board__specimen-huge {
      font-size: 32px;
      line-height: 1.2;
    }
    .board__specimen-15 {
      font-size: 15px;
    }
    .board__specimen-13 {
      font-size: 13px;
    }
    .board__panels {
      display: flex;
      gap: 16px;
      margin-top: 24px;
    }
    .board__panel iframe {
      width: 320px;
      height: 720px;
      border: 1px solid #d0d2d8;
      display: block;
    }
    .board__panel-label {
      font-size: 12px;
      color: #4a4e58;
      margin: 0 0 6px;
    }
    .board__error {
      color: #b3261e;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="board" id="board">
    <div class="board__error" id="boardError" hidden>Paramètre ?pair= manquant ou inconnu.</div>
  </div>
  <script src="../lab/identity-pairs.js"></script>
  <script src="board.js"></script>
</body>
</html>
