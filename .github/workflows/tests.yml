name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: safety check (no internal file or secret in the public repository)
        if: matrix.os == 'ubuntu-latest'
        # Replays the local pre-push hook on the pushed tree: last safety net
        # when a clone does not have the hook installed.
        run: echo "refs/heads/ci $(git rev-parse HEAD) refs/heads/ci 0000000000000000000000000000000000000000" | bash scripts/hooks/pre-push

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: bun install (broker)
        run: bun install --frozen-lockfile
        working-directory: broker

      - name: bun test (broker)
        run: bun test
        working-directory: broker

      - name: build.sh
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/build.sh

      - name: build-binaries.sh (this runner's own target)
        # goal G4 "binaries + Windows CI": builds only the host target here —
        # no cross-compile download — then proves the compiled binary can
        # still dynamic-import an external module (docs/ARCHITECTURE.md).
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) target=linux-x64 ;;
            macos-latest) target=darwin-arm64 ;;
            windows-latest) target=windows-x64 ;;
          esac
          bash scripts/build-binaries.sh "$target"

      - name: --check-modules smoke (compiled binary)
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) bin=dist/bin/coati-broker-linux-x64 ;;
            macos-latest) bin=dist/bin/coati-broker-darwin-arm64 ;;
            windows-latest) bin=dist/bin/coati-broker-windows-x64.exe ;;
          esac
          # $RUNNER_TEMP (set by actions/runner) is already a native path on
          # every OS — unlike git-bash's own mktemp/$PWD on Windows.
          fakehome="${RUNNER_TEMP:-$(mktemp -d)}/coati-check-modules-home"
          mkdir -p "$fakehome/.config/coati"
          # git-bash's own $PWD ("/c/...") isn't a path Bun's Windows
          # dynamic import() resolves — `pwd -W` (git-bash only) gives the
          # native "C:/..." form; falls back to $PWD elsewhere.
          root="$(pwd -W 2>/dev/null || pwd)"
          fixture="$root/broker/test/fixtures/modules/valid-provider.ts"
          cat > "$fakehome/.config/coati/config.json" <<EOF
          {
            "port": 8787,
            "allowedExtensionIds": [],
            "provider": "ollama",
            "ollamaUrl": "http://127.0.0.1:11434",
            "modules": [{ "path": "$fixture", "options": { "id": "smoke-valid" } }]
          }
          EOF
          # os.homedir() reads $HOME on POSIX but $USERPROFILE on Windows —
          # set both, harmless where unused.
          HOME="$fakehome" USERPROFILE="$fakehome" "$bin" --check-modules

      - name: scripts/ci/e2e.sh (install → Native Messaging handshake → ws-probe → uninstall)
        # goal G4 "CI end to end": exercises the real OS installer, the
        # installed binary as both broker and Native Messaging host, and the
        # uninstaller — all under a throwaway HOME/USERPROFILE, never the
        # runner's real one. See scripts/ci/e2e.sh's own header for the step
        # list; it prints PASS/FAIL per step.
        # Windows: tolerated until a hand test on a real Windows machine
        # (the failure there cannot be read without a signed-in account).
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) target=linux-x64 ;;
            macos-latest) target=darwin-arm64 ;;
            windows-latest) target=windows-x64 ;;
          esac
          bash scripts/ci/e2e.sh "$target"

      - name: extension e2e (Playwright, Chromium, real port 8787)
        # ubuntu-latest only: needs dist/stage/chrome (built above, Linux
        # only) and a free port 8787 — see scripts/ci/extension-e2e.mjs's
        # header for what this could and could not be verified locally.
        if: matrix.os == 'ubuntu-latest'
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          node scripts/ci/extension-e2e.mjs

      - name: web-ext lint (chrome)
        if: matrix.os == 'ubuntu-latest'
        # web-ext is a Firefox tool: it always reports BACKGROUND_SERVICE_WORKER_NOFALLBACK and
        # ADDON_ID_REQUIRED on a Chrome-only manifest.json (background.service_worker without a
        # Firefox scripts fallback, no browser_specific_settings.gecko.id — Chrome uses "key"
        # instead). Structural, not a defect: informational only, doesn't block the job. The
        # Firefox package below runs the same tool as a real gate (0 errors expected).
        continue-on-error: true
        run: npx --yes web-ext@10.7.0 lint --source-dir dist/stage/chrome

      - name: web-ext lint (firefox)
        if: matrix.os == 'ubuntu-latest'
        run: npx --yes web-ext@10.7.0 lint --source-dir dist/stage/firefox

  test-arm64:
    # goal G4 "CI end to end": linux-arm64 gets its own job (no arm64 slot in
    # the ubuntu-latest matrix entry) — bun test, the compiled binary, and
    # the same install → handshake → uninstall e2e as the other three OS.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: bun install (broker)
        run: bun install --frozen-lockfile
        working-directory: broker

      - name: bun test (broker)
        run: bun test
        working-directory: broker

      - name: build-binaries.sh (linux-arm64)
        run: bash scripts/build-binaries.sh linux-arm64

      - name: scripts/ci/e2e.sh (linux-arm64)
        run: bash scripts/ci/e2e.sh linux-arm64

  packages:
    # Installers and Linux packages (scripts/package.sh): the macOS zip keeps
    # the executable bit, and the .deb / .rpm install, set Coati up system-wide
    # and remove cleanly in a stock Debian and Fedora container (no systemd).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: bun install (broker)
        run: bun install --frozen-lockfile
        working-directory: broker

      - run: bash scripts/build-binaries.sh linux-x64 darwin-arm64

      - run: bash scripts/ci/install-nfpm.sh

      - run: bash scripts/package.sh linux-x64 darwin-arm64

      - name: macOS zip keeps the executable bit
        run: zipinfo dist/pkg/Coati-Setup-macos-arm64.zip | grep -E '^-rwxr-xr-x .* Installer Coati$'

      - name: install and remove the .deb (debian:stable)
        run: docker run --rm -v "$PWD/dist/pkg:/pkg:ro" -v "$PWD/scripts/ci:/ci:ro" debian:stable bash /ci/package-check.sh deb

      - name: install and remove the .rpm (fedora:latest)
        run: docker run --rm -v "$PWD/dist/pkg:/pkg:ro" -v "$PWD/scripts/ci:/ci:ro" fedora:latest bash /ci/package-check.sh rpm
